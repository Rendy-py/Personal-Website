<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Personal Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    <!-- Tambahan CSS untuk Background Image -->
    <style>
        body {
            /* Panggil background dari folder static/asset/ */
            background-image: url("{{ url_for('static', filename='asset/thomas-fatin-6oBUCu9FIOc-unsplash.jpg') }}");
            
            /* Biar gambarnya nutupin seluruh layar full */
            background-size: cover; 
            
            /* Posisinya selalu di tengah */
            background-position: center center; 
            
            /* Biar gambarnya nggak berulang (tiling) */
            background-repeat: no-repeat; 
            
            /* Biar kalau di-scroll, gambarnya tetep diem di tempat (opsional) */
            background-attachment: fixed; 
        }
    </style>

<body>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('projects') }}">Projects</a>
        <a href="https://www.linkedin.com/in/farrelinorendy/">LinkedIn</a>
        <a href="https://www.instagram.com/farrelinorendy/">Instagram</a>
    </nav>

    <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 0;  margin-top: 5px;">My Projects</h1>
        <p style="color: #666; font-size: 0.9rem; margin-top: 10px;">(Swipe and click the card to see the details.)</p>    
        
        <div class="slider-container">
            {% for project in projects %}
            <!-- Tambahin onclick di sini biar pas diklik dia ngirim data ke JavaScript -->
            <div class="project-card" onclick="bukaPopup('{{ project.name }}', '{{ project.desc }}', '{{ url_for("static", filename=project.image) }}')">
                <img src="{{ url_for('static', filename=project.image) }}" alt="{{ project.name }}">
                <div class="project-info">
                    <h3>{{ project.name }}</h3>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- INI ADALAH KERANGKA POP-UP (MODAL) NYA -->
    <div id="myModal" class="modal-bg">
        <!-- Pakai class container biar pop-upnya ikut dapet efek glassmorphism -->
        <div class="modal-content container"> 
            <span class="close-btn" onclick="tutupPopup()">&times;</span>
            <img id="popup-img" src="" alt="Detail Project">
            <h2 id="popup-title">Nama Project</h2>
            <p id="popup-desc">Deskripsi lengkap project akan muncul di sini.</p>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT KECIL BUAT JALANIN POP-UP -->
    <script>
        function bukaPopup(nama, desc, gambar) {
            // Masukin data dari Python/HTML ke dalam Pop-up
            document.getElementById("popup-title").innerText = nama;
            document.getElementById("popup-desc").innerText = desc;
            document.getElementById("popup-img").src = gambar;
            
            // Tampilkan pop-upnya
            document.getElementById("myModal").style.display = "flex";
        }

        function tutupPopup() {
            // Sembunyikan pop-upnya
            document.getElementById("myModal").style.display = "none";
        }
    </script>
</body>
</html>
